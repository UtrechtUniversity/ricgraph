#
# Use this override.conf file for your Apache or Nginx webserver if
# your own apache2 or nginx service file does not restart the
# webserver on errors.
#
# It adds some lines to the regular apache2/nginx service file,
# to make sure that the webserver is restarted after a failure or
# a system update.
# This is not normally the case with the catalog item Ubuntu 24.04
# on SURF research cloud in fall 2026.
#
# Rik D.T. Janssen, November 16, 2026.
#
# For Apache:
# copy to /etc/systemd/system/apache2.service.d/override.conf.
# For Nginx:
# copy to /etc/systemd/system/nginx.service.d/override.conf.
#
# Then execute:
# systemctl daemon-reload
# systemctl restart [your service file]
#

[Unit]
# Give up after 43 starts within 1 hour
StartLimitIntervalSec=1h
StartLimitBurst=43

[Service]
# Retry every 20 seconds after a failure
Restart=on-failure
RestartSec=20s

